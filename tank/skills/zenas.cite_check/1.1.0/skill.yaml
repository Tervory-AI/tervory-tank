id: zenas.cite_check
version: 1.1.0
agent: zenas
rung: 3
description: >
  Check that every citation resolves to a pool passage and that every quote
  matches that passage word for word. A quote shown masked passes only through
  the fingerprint of the exact court words it was built from. A miss blocks delivery.
input:
  type: object
  properties:
    statements: {type: array}
    passages: {type: array}
output:
  type: object
  properties:
    passed: {type: boolean}
    blocked: {type: boolean}
eval_threshold: 1.0
