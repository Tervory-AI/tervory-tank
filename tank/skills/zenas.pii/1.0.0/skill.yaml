id: zenas.pii
version: 1.0.0
agent: zenas
rung: 3
description: >
  Find personal identifiers in a document and replace them with placeholders.
  South African ID numbers use the official checksum. US Social Security
  numbers and passport numbers use their published shapes. The raw value is
  not returned.
input:
  type: object
  properties:
    text: {type: string}
output:
  type: object
  properties:
    text: {type: string}
    matches: {type: array}
eval_threshold: 1.0
