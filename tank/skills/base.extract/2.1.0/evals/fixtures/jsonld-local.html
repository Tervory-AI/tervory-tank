<!DOCTYPE html>
<html>
<head>
  <meta name="description" content="Maps and bottles for the trail.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Trail Counter",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "itemListElement": [
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Water bottles"}},
        {"@type": "Offer", "itemOffered": {"@type": "Product", "name": "Trail maps"}}
      ]
    }
  }
  </script>
</head>
<body>
  <p>Trail Counter sells gear for day hikes and keeps maps at the front desk.</p>
</body>
</html>
