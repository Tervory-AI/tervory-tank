id: base.extract
version: 2.1.0
agent: base
rung: 3
description: >
  Pass 2c. Reads a business page and returns what they sell, what they do, a one-line
  description, and named people. Structured data first, then headings and menus, then
  the vocabulary the engine passed in. Pure code. Nothing is invented.
input:
  type: object
  required: [name, text]
  properties:
    name: {type: string}
    text: {type: string}
    html: {type: string}
    pages: {type: array, items: {type: object, properties: {source_url: {type: string}, checked_at: {type: string}, html: {type: string}}}}
    fixture: {type: string}
    engine: {type: string, description: engine id whose data files supply term dictionaries}
    vocabulary: {type: object, description: "{categories: {term: label}, services: {term: label}}"}
output:
  type: object
  properties:
    categories: {type: array}
    services: {type: array}
    description: {type: string}
    people: {type: array}
    products:
      type: array
      maxItems: 50
      items:
        type: object
        properties:
          name: {type: string, maxLength: 200}
          sku: {type: string, maxLength: 200}
          gtin: {type: string, maxLength: 200}
          mpn: {type: string, maxLength: 200}
          brand: {type: string, maxLength: 200}
          price: {type: string, maxLength: 200}
          currency: {type: string, maxLength: 200}
          availability: {type: string, maxLength: 200}
          url: {type: string, maxLength: 200}
          source_url: {type: string, maxLength: 200}
          checked_at: {type: string, maxLength: 200}
          method: {type: string, maxLength: 200}
    fields: {type: object, description: method and confidence for each field}
eval_threshold: 0.8
