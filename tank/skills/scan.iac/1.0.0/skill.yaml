id: scan.iac
version: 1.0.0
agent: radix
rung: 3
description: >
  Runs Checkov's bundled infrastructure checks on handed-over files in the
  Radix room. No downloads. Severity is unknown without the Checkov platform.
input:
  type: object
  required: [files]
  properties:
    files:
      type: array
output:
  type: object
  properties:
    file: {type: string}
    line: {type: integer}
    rule: {type: string}
    severity: {type: string}
    critical: {type: integer}
    status: {type: string}
    findings: {type: array}
eval_threshold: 1.0
