id: base.scrape_site
version: 1.1.0
agent: base
rung: 3
description: >
  Pass 2b. Fetches a site's home page and its contact/about pages, and pulls out emails, phones,
  social links and the visible text (trimmed) for the extraction pass. Pure code.
input:
  type: object
  required: [website]
  properties: {website: {type: string}}
output:
  type: object
  properties: {emails: {type: array}, phones: {type: array}, socials: {type: object}, text: {type: string}, pages: {type: array}}
eval_threshold: 1.0
