id: market.research
version: 1.1.0
agent: market_lab
rung: 3
task_type: market.research
description: >
  Code-first series adapter lookups and gap arithmetic; the existing Tank
  market.research route writes only the summary. Requires room-supplied
  adapter responses, never uses a model to retrieve series.
input:
  type: object
  required: [question]
  properties:
    question: {type: string}
    passages: {type: array}
    series: {type: array}
    areas: {type: array}
output:
  type: object
  properties:
    answer: {type: string}
    citations: {type: array}
    series: {type: array}
    gaps: {type: object}
eval_threshold: 1.0
