# Zenas room for the South Africa region. Deploy this file as its own Coolify
# resource on the SA server (Base Directory /agents/zenas, Compose Location
# /docker-compose.za.yml). The room keeps its gateway corridor and gains a
# private Docassemble-only network. The corridor is created by the root stack.
# The room gets its Tank key and its own database login only.
# No model keys: those live only in the ZA Tank stack (litellm).

services:
  agent-zenas:
    build:
      context: ..
      dockerfile: zenas/Dockerfile
    restart: unless-stopped
    depends_on:
      docassemble:
        condition: service_healthy
    mem_limit: 2g
    cpus: 0.5
    environment:
      TANK_REGION: za
      AGENT_NAME: zenas
      LAWS_AFRICA_API_TOKEN: ${LAWS_AFRICA_API_TOKEN:-}
      # Founder creates Cloudflare R2 bucket tervory-zenas-za and sets this name.
      # US agent-zenas keeps R2_BUCKET: tervory-zenas unchanged.
      R2_BUCKET_ZENAS_ZA: ${R2_BUCKET_ZENAS_ZA:-}
      R2_BUCKET: ${R2_BUCKET_ZENAS_ZA:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID_ZENAS: ${R2_ACCESS_KEY_ID_ZENAS:-}
      R2_SECRET_ACCESS_KEY_ZENAS: ${R2_SECRET_ACCESS_KEY_ZENAS:-}
      DATABASE_URL: postgresql://agent_zenas:${AGENT_DB_PASSWORD_ZENAS}@postgres:5432/${POSTGRES_DB:-tervory}
      TANK_URL: http://tank:8000
      TANK_KEY: ${TANK_KEY:-}
      HERMES_URL: http://hermes:8000
      DOCASSEMBLE_REGION: za
      DOCASSEMBLE_URL: http://docassemble
      DOCASSEMBLE_API_KEY: ${DOCASSEMBLE_API_KEY:-}
      ZENAS_PII_KEY: ${ZENAS_PII_KEY:-}
      ZENAS_MATTER_SHARING: ${ZENAS_MATTER_SHARING:-region}
      DATA_DIR: /data
    volumes:
      - za_agent_data:/data
    networks:
      - gw
      - assembly
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  # Official image; no public port, ingress label, gateway or remote database.
  docassemble:
    image: jhpyle/docassemble:1.10.14@sha256:5dc6feb56f69a912885ad5652d1754330f37c1a05331c5831e34e9d0c509492d
    restart: unless-stopped
    stop_grace_period: 10m
    mem_limit: 4g
    cpus: 1
    environment:
      TANK_REGION: za
      CONTAINERROLE: all
      DAHOSTNAME: docassemble
      DAUPDATEONSTART: "false"
      DAALLOWUPDATES: "false"
      DAENABLEPLAYGROUND: "false"
      DADEBUG: "false"
      DAALLOWLOGVIEWING: "false"
      DBPASSWORD: ${DOCASSEMBLE_DB_PASSWORD:?Set the Docassemble database password in Coolify}
      DASECRETKEY: ${DOCASSEMBLE_SECRET_KEY:?Set the Docassemble secret key in Coolify}
      DA_ADMIN_EMAIL: ${DOCASSEMBLE_ADMIN_EMAIL:?Set the Docassemble admin email in Coolify}
      DA_ADMIN_PASSWORD: ${DOCASSEMBLE_ADMIN_PASSWORD:?Set the Docassemble admin password in Coolify}
      DA_ADMIN_API_KEY: ${DOCASSEMBLE_API_KEY:?Set the Docassemble API key in Coolify}
      TIMEZONE: UTC
      DABACKUPDAYS: "14"
    volumes:
      - docassemble_za_backup:/usr/share/docassemble/backup
      - ./docassemble/package:/usr/share/docassemble/local3.14/lib/python3.14/site-packages/docassemble/zenas:ro
      - ./core/drafting.py:/usr/share/docassemble/local3.14/lib/python3.14/site-packages/docassemble/zenas/legacy.py:ro
      - ./docassemble/za:/usr/share/docassemble/local3.14/lib/python3.14/site-packages/docassemble/zenas/data/questions/region:ro
    networks: [assembly]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/health_check?ready=1"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 20

  # Reuses the existing age/R2 worker; only completed local snapshots are archived.
  docassemble-backup:
    build:
      context: ../..
      dockerfile: jobs/train/Dockerfile.backup
    restart: unless-stopped
    user: "0:0"
    read_only: true
    mem_limit: 512m
    cpus: 0.25
    tmpfs: [/tmp]
    environment:
      AGENT_NAME: zenas
      TANK_REGION: za
      R2_BUCKET_ZENAS_ZA: ${R2_BUCKET_ZENAS_ZA:-}
      R2_BUCKET: ${R2_BUCKET_ZENAS_ZA:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID_ZENAS: ${R2_ACCESS_KEY_ID_ZENAS:-}
      R2_SECRET_ACCESS_KEY_ZENAS: ${R2_SECRET_ACCESS_KEY_ZENAS:-}
      R2_BACKUP_RECIPIENT: ${R2_BACKUP_RECIPIENT:-}
    volumes:
      - docassemble_za_backup:/backup:ro
      - ./docassemble/backup.py:/app/jobs/train/docassemble_backup.py:ro
    command: ["python", "jobs/train/docassemble_backup.py", "--nightly"]
    networks: [backup]

  # One-shot SA pool load. Not started with the room.
  # docker compose -f docker-compose.za.yml --profile load run --rm pool-loader
  pool-loader:
    build:
      context: ..
      dockerfile: zenas/pool/Dockerfile
    restart: "no"
    mem_limit: 2g
    cpus: 0.25
    profiles:
      - load
    environment:
      HERMES_URL: http://hermes:8000
      TANK_KEY: ${TANK_KEY:-}
      TANK_REGION: za
      DATABASE_URL: postgresql://agent_zenas:${AGENT_DB_PASSWORD_ZENAS}@postgres:5432/${POSTGRES_DB:-tervory}
      LAWS_AFRICA_API_TOKEN: ${LAWS_AFRICA_API_TOKEN:-}
      POOL_DISK_CAP_BYTES: ${POOL_DISK_CAP_BYTES:-}
      SAFLII_MIN_INTERVAL: ${SAFLII_MIN_INTERVAL:-1}
      GOVZA_MAX_NOTICES: ${GOVZA_MAX_NOTICES:-10}
      GOVZA_MIN_INTERVAL: ${GOVZA_MIN_INTERVAL:-1}
      CONCOURT_MIN_INTERVAL: ${CONCOURT_MIN_INTERVAL:-10}
      CONCOURT_MAX_ITEMS: ${CONCOURT_MAX_ITEMS:-5}
      ZA_CASE_MIN_INTERVAL: ${ZA_CASE_MIN_INTERVAL:-1}
      ZA_CASE_MAX_DOCS: ${ZA_CASE_MAX_DOCS:-8}
      SCA_MAX_YEARS: ${SCA_MAX_YEARS:-1}
      SCA_MAX_PAGES: ${SCA_MAX_PAGES:-1}
      POOL_LOAD: ${POOL_LOAD:-}
      DATA_DIR: /data
    volumes:
      - za_agent_data:/data
    networks:
      - gw
    entrypoint: ["nice", "-n", "19", "python", "-m", "agents.zenas.pool.bulk"]

volumes:
  docassemble_za_backup:
  # Local to the SA server. Never replicated to the United States.
  za_agent_data:

networks:
  assembly:
    internal: true
  backup:
  gw:
    external: true
    name: tervory-gw-zenas
