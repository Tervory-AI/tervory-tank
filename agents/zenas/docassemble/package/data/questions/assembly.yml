modules:
  - docassemble.zenas.assembly
---
mandatory: True
code: |
  if request["mode"] == "assemble":
    json_response(prepare(request, assembly_jurisdiction, assembly_template))
  elif request["mode"] == "finish":
    result = finish(request, assembly_jurisdiction, assembly_template)
    document
    json_response({"text": result["text"], "file_number": document.docx.number})
---
attachment:
  variable name: document
  filename: draft
  docx template file: document.docx
  valid formats:
    - docx
