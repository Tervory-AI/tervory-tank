# coolify: raw compose
# Retained dormant definition: this seal fix does not authorize starting Docassemble.
# Before any deployment, resolve retirement and select the existing regional backup volume.
# Docassemble for Zenas (South Africa), deployed as its OWN Coolify resource, separate
# from agent-zenas (28 Oct): Docassemble starts slowly (up to ~15 min), and inside agent-zenas
# that slow start failed every Zenas deploy. Same Base Directory as the room (/agents/zenas).
# deploy-on-merge does not deploy this resource (its name does not start with agent-); Grok
# redeploys it when these files change.
# The shared private network is created once on the server:
#   docker network create --internal tervory-zenas-assembly
# agent-zenas joins the same network and calls http://docassemble (the code allows only that private host).
# Backup script is COPY'd into the image (docassemble/Dockerfile.backup) — do not bind-mount
# ./docassemble/backup.py from Coolify's sparse app workdir (Docker turns a missing path into
# an empty directory and the sidecar cannot run).

services:
  # Official image; no public port, ingress label, gateway or remote database.
  docassemble:
    # The official pinned image plus the Zenas package (docassemble/Dockerfile); no nested mounts.
    build:
      context: .
      dockerfile: docassemble/Dockerfile
      args:
        REGION_DIR: za
    restart: unless-stopped
    stop_grace_period: 10m
    mem_limit: 4g
    cpus: 1
    environment:
      TANK_REGION: za
      CONTAINERROLE: all
      DAHOSTNAME: docassemble
      DAUPDATEONSTART: "false"
      DAALLOWUPDATES: "false"
      DAENABLEPLAYGROUND: "false"
      DADEBUG: "false"
      DAALLOWLOGVIEWING: "false"
      DBPASSWORD: ${DOCASSEMBLE_DB_PASSWORD:?Set the Docassemble database password in Coolify}
      DASECRETKEY: ${DOCASSEMBLE_SECRET_KEY:?Set the Docassemble secret key in Coolify}
      DA_ADMIN_EMAIL: ${DOCASSEMBLE_ADMIN_EMAIL:?Set the Docassemble admin email in Coolify}
      DA_ADMIN_PASSWORD: ${DOCASSEMBLE_ADMIN_PASSWORD:?Set the Docassemble admin password in Coolify}
      DA_ADMIN_API_KEY: ${DOCASSEMBLE_API_KEY:?Set the Docassemble API key in Coolify}
      TIMEZONE: UTC
      DABACKUPDAYS: "14"
    volumes:
      - docassemble_za_backup:/usr/share/docassemble/backup
    networks:
      assembly:
        aliases: [docassemble]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/health_check?ready=1"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 20

  # Reuses the existing age/R2 worker; only completed local snapshots are archived.
  # Requires R2_BACKUP_RECIPIENT (public age recipient); empty → sidecar exits 1 by design.
  docassemble-backup:
    build:
      context: ../..
      dockerfile: agents/zenas/docassemble/Dockerfile.backup
    restart: unless-stopped
    user: "0:0"
    read_only: true
    mem_limit: 512m
    cpus: 0.25
    tmpfs: [/tmp]
    environment:
      AGENT_NAME: zenas
      TANK_REGION: za
      R2_BUCKET_ZENAS_ZA: ${R2_BUCKET_ZENAS_ZA:-}
      R2_BUCKET: ${R2_BUCKET_ZENAS_ZA:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID_ZENAS: ${R2_ACCESS_KEY_ID_ZENAS:-}
      R2_SECRET_ACCESS_KEY_ZENAS: ${R2_SECRET_ACCESS_KEY_ZENAS:-}
      R2_BACKUP_RECIPIENT: ${R2_BACKUP_RECIPIENT:-}
    volumes:
      - docassemble_za_backup:/backup:ro
    command: ["python", "jobs/train/docassemble_backup.py", "--nightly"]
    # Scheduled-worker liveness only; encrypted archive/restore proof is separate.
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; c=Path('/proc/1/cmdline').read_bytes().split(bytes([0])); raise SystemExit(0 if b'jobs/train/docassemble_backup.py' in c and b'--nightly' in c else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backup]

volumes:
  docassemble_za_backup:
    # Fail closed: never replace a retained backup with a newly created empty volume.
    external: true
    name: ${DOCASSEMBLE_ZA_BACKUP_VOLUME:?Set the existing regional Docassemble backup volume name}

networks:
  assembly:
    external: true
    name: tervory-zenas-assembly
  backup:
