# Autumbra Enforce — packaged ansible.cfg snippet (stronger-than-stock)
# gathering = explicit — no surprise fact collection
# No Galaxy auto-fetch in the Enforce path; vendor roles onsite.
[defaults]
gathering = explicit
retry_files_enabled = False
host_key_checking = True
# Do not pull roles/collections from Galaxy during Autumbra Enforce runs.
# roles_path / collections_paths must be operator-supplied onsite when armed.
stdout_callback = default
bin_ansible_callbacks = False

[galaxy]
# Leave server_list empty / unused — Autumbra Enforce must not Galaxy-install at apply time.
