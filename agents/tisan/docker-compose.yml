# coolify: raw compose
# Tisan, the developer and designer. Deploy this file as its own Coolify resource.
# Build context is the repository root to reuse ops/live_check.mjs.
# The Figma reader code path uses the dedicated proxy link.
# The external gw bridge is not a network-level egress seal.
# Created once on the server: docker network create tervory-gw-tisan

services:
  agent-tisan:
    build:
      context: ../..
      dockerfile: agents/tisan/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.25
    environment:
      AGENT_NAME: tisan
      TISAN_BRAIN_ENABLED: ${TISAN_BRAIN_ENABLED:-false}
      FIGMA_TOKEN: ${FIGMA_TOKEN:-}
      TISAN_FIGMA_FILES: ${TISAN_FIGMA_FILES:-}
      TISAN_COOLIFY_URL: ${TISAN_COOLIFY_URL:-}
      TISAN_COOLIFY_TOKEN: ${TISAN_COOLIFY_TOKEN:-}
      R2_BUCKET: tervory-tisan
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID_TISAN: ${R2_ACCESS_KEY_ID_TISAN:-}
      R2_SECRET_ACCESS_KEY_TISAN: ${R2_SECRET_ACCESS_KEY_TISAN:-}
      DATABASE_URL: postgresql://agent_tisan:${AGENT_DB_PASSWORD_TISAN}@postgres:5432/${POSTGRES_DB:-tervory}
      CHASSIS_ADMIN_DATABASE_URL: ${CHASSIS_ADMIN_DATABASE_URL:-}
      CHASSIS_RLS_ADMIN_ROLE: ${CHASSIS_RLS_ADMIN_ROLE:-}
      TANK_URL: http://tank:8000
      TANK_KEY: ${TANK_KEY_TISAN:-}
      HERMES_URL: http://hermes:8000
      DATA_DIR: /data
      TERVORY_ADMIN_USER_IDS: ${TERVORY_ADMIN_USER_IDS:-}
      TANK_REGION: ${TANK_REGION:-us-east}
    volumes:
      - agent_tisan_data:/data
    networks:
      - gw
      - figma_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  figma-egress-proxy:
    build:
      context: ..
      dockerfile: radix/Dockerfile
    command:
      - python
      - -c
      - >-
        from egress import Proxy, Server, private_bind_address, system_resolve;
        allowed = 'api.figma.com';
        proxy = Proxy(verified_host=allowed, allow_storage=False, require_sni=True, max_response_bytes=5_000_000,
          resolve=lambda host: system_resolve(host, verified_host=allowed));
        Server(proxy, host=private_bind_address(), port=8080).serve_forever()
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Probe only the private listener; never call Figma or widen its egress policy.
      test: ["CMD", "python", "-c", "import socket; from egress import private_bind_address; s = socket.create_connection((private_bind_address(), 8080), timeout=3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      figma_internal:
        interface_name: radix-link
      egress: {}

  tisan-brain:
    profiles:
    - brain
    build:
      context: ../..
      dockerfile: agents/tisan/Dockerfile
    command:
    - uvicorn
    - brain_service:app
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    - --no-access-log
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
    environment:
      BRAIN_ROOM: tisan
      TISAN_BRAIN_ENABLED: ${TISAN_BRAIN_ENABLED:-false}
      DATABASE_URL: postgresql://agent_tisan:${AGENT_DB_PASSWORD_TISAN}@postgres:5432/${POSTGRES_DB:-tervory}
      TANK_REGION: ${TANK_REGION:-us-east}
      TANK_URL: http://tank:8000
      TANK_KEY: ${TANK_KEY_TISAN:-}
      HERMES_URL: http://hermes:8000
      TISAN_URL: http://agent-tisan:8000
      TISAN_SANDBOX_URL: http://tisan-sandbox:8002
      SANDBOX_KEY: ${SANDBOX_KEY_TISAN:-}
      DATA_DIR: /data
      TISAN_BROWSER_URL: http://tisan-browser-gateway:3000
    volumes:
    - tisan_brain_data:/data
    networks:
    - gw
    - sandbox
    depends_on:
      tisan-sandbox:
        condition: service_healthy
      tisan-browser-gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  tisan-sandbox:
    profiles:
    - brain
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.sandbox
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    environment:
      BRAIN_ROOM: tisan
      SANDBOX_KEY: ${SANDBOX_KEY_TISAN:-}
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
    - /work:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700
    networks:
    - sandbox
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  tisan-browser:
    profiles:
    - brain
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.browser
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.5
    shm_size: 256m
    environment:
      ACCESS_ROOM: tisan
      ACCESS_GATEWAY_URL: http://tisan-browser-gateway:3000
      BROWSER_PROXY_URL: http://tisan-browser-gateway:3128
    volumes:
    - tisan_browser_data:/browser-data
    networks:
    - browser
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    pids_limit: 128
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
    init: true
  tisan-browser-gateway:
    profiles:
    - brain
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.gateway
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      TANK_KEY: ${TANK_KEY_TISAN:-}
      TANK_REGION: us-east
      ACCESS_ROOM: tisan
      BROWSER_HOST: tisan-browser
    networks:
    - gw
    - browser
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    pids_limit: 128
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m

volumes:
  agent_tisan_data:

  tisan_brain_data:
    name: tervory-tisan-brain-data
  tisan_browser_data:
    name: tervory-tisan-browser-data
networks:
  sandbox:
    internal: true
  browser:
    internal: true
  gw:
    external: true
    name: tervory-gw-tisan
  figma_internal:
    internal: true
  egress: {}
