# Base. Deploy this file as its own Coolify resource.
# Build context is the repo root, because the chassis (agents/_chassis) and the engine data files
# (tank/skills/*.profile/*/data) both live outside this folder.
# The room retains its external gateway. Its brain and browser gateway join that
# corridor; the sandbox daemon and browser each stay on a separate internal net.

services:
  agent-base:
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      AGENT_NAME: base
      TANK_REGION: us-east
      DATABASE_URL: postgresql://agent_base:${AGENT_DB_PASSWORD_BASE}@postgres:5432/${POSTGRES_DB:-tervory}
      TANK_URL: http://tank:8000
      TANK_KEY: ${TANK_KEY_BASE:-}
      BASE_BRAIN_URL: http://base-brain:8001
      SEARXNG_URL: http://searxng:8080
      HERMES_URL: http://hermes:8000
      DATA_DIR: /data
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      CONTEXT_DEV_MAX_CREDITS: ${CONTEXT_DEV_MAX_CREDITS:-500}
    volumes:
      - agent_base_data:/data
    networks:
      - gw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  base-brain:
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.brain
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    environment:
      TANK_URL: http://tank:8000
      TANK_KEY: ${TANK_KEY_BASE:-}
      TANK_REGION: us-east
      HERMES_URL: http://hermes:8000
      BASE_ROOM_URL: http://agent-base:8000
      BASE_BROWSER_URL: http://base-browser-gateway:3000
      DATA_DIR: /data
      DOCKER_HOST: tcp://base-sandbox:2375
    volumes:
      - base_brain_data:/data
    networks: [gw, sandbox]
    depends_on:
      base-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # A dedicated daemon, never the host Docker socket. It sees only Base's volume.
  # Sandboxes have --network none and mount only the current run's work directory.
  base-sandbox:
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.sandbox
    privileged: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - base_brain_data:/data
      - base_sandbox_data:/home/rootless/.local/share/docker
    networks: [sandbox]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/base-sandbox-ready && docker info >/dev/null && docker version >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  base-browser:
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.browser
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    shm_size: 256m
    environment:
      TANK_KEY: ${TANK_KEY_BASE:-}
      TANK_REGION: us-east
      BASE_ALLOWED_HOSTS: ${BASE_ALLOWED_HOSTS:-www.atf.gov,atf.gov}
    volumes:
      - base_browser_data:/browser-data
    networks: [browser]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  base-browser-gateway:
    build:
      context: ../..
      dockerfile: agents/base/Dockerfile.gateway
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      TANK_KEY: ${TANK_KEY_BASE:-}
      TANK_REGION: us-east
      BASE_ALLOWED_HOSTS: ${BASE_ALLOWED_HOSTS:-www.atf.gov,atf.gov}
    networks: [gw, browser]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  agent_base_data:
  base_brain_data:
  base_browser_data:
  base_sandbox_data:

networks:
  sandbox:
    internal: true
  browser:
    internal: true
  gw:
    external: true
    name: tervory-gw-base
