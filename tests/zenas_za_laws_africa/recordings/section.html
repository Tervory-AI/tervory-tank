<div class="akn-act"><section class="akn-section" id="sec_66"><h3><span class="akn-num">66.</span> <span class="akn-heading">Board, directors and prescribed officers</span></h3><section class="akn-subsection" id="sec_66__subsec_1"><span class="akn-num">(1)</span><span class="akn-content"><p class="akn-p">The business and affairs of a company must be managed by or under the direction of its board.</p></span></section></section></div>
