<!DOCTYPE html>
<html>
<head>
  <title>Sample item</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Sample item",
    "offers": {
      "@type": "AggregateOffer",
      "url": "https://example.test/range",
      "lowPrice": "5.00",
      "highPrice": "15.00",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock"
    }
  }

</head>
<body><h1>Sample item</h1><p>$15.00</p></body>
</html>
