# Tervory platform — one stack, one deploy.
# Coolify deploys this file. Stack services share one network and reach each other
# by name (http://tank:8000, postgres:5432). Agent boxes are not in this file.
# Each box is its own Coolify resource (agents/<name>/docker-compose.yml) and
# reaches Tank and Postgres only through an external network, tervory-gw-<agent>,
# created once on the server. Nothing else joins that network. Only the Workspace
# gets a public domain; Tank and the stores are never exposed.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tervory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tervory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tervory}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - tervory-gw-template

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrantdata:/qdrant/storage

  # Shared memory. On the main network so it can reach Qdrant, and on every
  # agent corridor. Today that is tervory-gw-template. A later agent task adds
  # its tervory-gw-<agent> network here, and TANK_KEY_<AGENT> in the environment
  # below. No public domain. Agents call this service. They never call Qdrant.
  hermes:
    build: ./hermes
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      TANK_API_KEY: ${TANK_API_KEY}
      TANK_KEY_TEMPLATE: ${TANK_KEY_TEMPLATE:-}
      HERMES_EMBED_MODEL: ${HERMES_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    depends_on:
      - qdrant
    networks:
      - default
      - tervory-gw-template
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  litellm:
    build: ./litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}

  searxng:
    build: ./searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-in-coolify}
      SEARXNG_BASE_URL: http://searxng:8080/
    expose:
      - "8080"

  tiger:
    build: ./tiger
    restart: unless-stopped
    shm_size: "1gb"            # Chromium needs shared memory
    environment:
      TIGER_MAX_PAGES: ${TIGER_MAX_PAGES:-4}
    expose:
      - "3000"

  tank:
    build: ./tank
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tervory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tervory}
      REDIS_URL: redis://redis:6379/0
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      TANK_API_KEY: ${TANK_API_KEY}
      TERVORY_ADMIN_USER_IDS: ${TERVORY_ADMIN_USER_IDS:-}
      TANK_KEY_TEMPLATE: ${TANK_KEY_TEMPLATE:-}
      TANK_REGION: ${TANK_REGION:-us-east}
      SEARXNG_URL: http://searxng:8080
      TIGER_URL: http://tiger:3000
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - default
      - tervory-gw-template
    expose:
      - "8000"

  # One shot. Creates agent_<name> roles, then exits. Tank does not wait on it
  # and does not mount this code. restart on-failure retries a failed run only.
  agent-roles:
    build:
      context: ./agents
      dockerfile: Dockerfile.roles
    restart: "on-failure"
    # One-shot job: it exits after setting up agent logins, so Coolify must not count it in the stack's health.
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tervory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tervory}
      AGENT_DB_PASSWORD_TEMPLATE: ${AGENT_DB_PASSWORD_TEMPLATE:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  workspace:
    build:
      context: ./workspace
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      TANK_URL: http://tank:8000
      TANK_API_KEY: ${TANK_API_KEY}
      TERVORY_ADMIN_USER_IDS: ${TERVORY_ADMIN_USER_IDS:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - tank
    # Coolify attaches the public domain to this service (port 3000).
    expose:
      - "3000"

volumes:
  pgdata:
  redisdata:
  qdrantdata:

# Created once on the server before this stack is deployed:
#   docker network create tervory-gw-template
# A later agent gets tervory-gw-<agent>, joined here by tank and postgres only.
networks:
  tervory-gw-template:
    external: true
    name: tervory-gw-template
