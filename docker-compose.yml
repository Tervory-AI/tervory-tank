# Tervory platform — one stack, one deploy.
# Coolify deploys this file. Stack services share one network and reach each other
# by name (http://tank:8000, postgres:5432). Agent boxes are not in this file.
# Each box is its own Coolify resource (agents/<name>/docker-compose.yml) and
# reaches Tank and Postgres only through an external network, tervory-gw-<agent>,
# created once on the server. Nothing else joins that network. Only the Workspace
# gets a public domain; Tank and the stores are never exposed.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tervory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tervory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tervory}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - tervory-gw-template
      - tervory-gw-tiger
      - tervory-gw-market_lab
      - tervory-gw-radix
      - tervory-gw-tisan
      - tervory-gw-zenas
      - tervory-gw-base
      - tervory-gw-rig

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    # Same pin as the South Africa stack. :latest made the two regions drift.
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # The image has bash and no HTTP client. An open port is the check it ships with.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Shared memory. On the main network so it can reach Qdrant, and on every
  # agent corridor. Today that is tervory-gw-template. A later agent task adds
  # its tervory-gw-<agent> network here, and TANK_KEY_<AGENT> in the environment
  # below. No public domain. Agents call this service. They never call Qdrant.
  hermes:
    build: ./hermes
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      TANK_API_KEY: ${TANK_API_KEY}
      TANK_KEY_TEMPLATE: ${TANK_KEY_TEMPLATE:-}
      TANK_KEY_TIGER: ${TANK_KEY_TIGER:-}
      TANK_KEY_MARKET_LAB: ${TANK_KEY_MARKET_LAB:-}
      TANK_KEY_RADIX: ${TANK_KEY_RADIX:-}
      TANK_KEY_TISAN: ${TANK_KEY_TISAN:-}
      TANK_KEY_ZENAS: ${TANK_KEY_ZENAS:-}
      TANK_KEY_BASE: ${TANK_KEY_BASE:-}
      TANK_KEY_RIG: ${TANK_KEY_RIG:-}
      HERMES_EMBED_MODEL: ${HERMES_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    depends_on:
      - qdrant
    networks:
      - default
      - tervory-gw-template
      - tervory-gw-tiger
      - tervory-gw-market_lab
      - tervory-gw-radix
      - tervory-gw-tisan
      - tervory-gw-zenas
      - tervory-gw-base
      - tervory-gw-rig
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  litellm:
    build: ./litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    healthcheck:
      # Port only. The image is Python; this does not send the master key.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',4000),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  searxng:
    build: ./searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-in-coolify}
      SEARXNG_BASE_URL: http://searxng:8080/
    networks:
      - default
      - tervory-gw-base
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  tiger:
    build: ./tiger
    restart: unless-stopped
    shm_size: "1gb"            # Chromium needs shared memory
    environment:
      TIGER_MAX_PAGES: ${TIGER_MAX_PAGES:-4}
    volumes:
      - tiger_data:/data
    networks:
      - default
      - tervory-gw-tiger
      - tervory-gw-base
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  tank:
    build:
      context: ./tank
      args:
        # Coolify sets SOURCE_COMMIT at image build. GIT_SHA overrides it for a local build.
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tervory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tervory}
      REDIS_URL: redis://redis:6379/0
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      TANK_API_KEY: ${TANK_API_KEY}
      TERVORY_ADMIN_USER_IDS: ${TERVORY_ADMIN_USER_IDS:-}
      TANK_KEY_TEMPLATE: ${TANK_KEY_TEMPLATE:-}
      TANK_KEY_TIGER: ${TANK_KEY_TIGER:-}
      TANK_KEY_MARKET_LAB: ${TANK_KEY_MARKET_LAB:-}
      TANK_KEY_RADIX: ${TANK_KEY_RADIX:-}
      TANK_KEY_TISAN: ${TANK_KEY_TISAN:-}
      TANK_KEY_ZENAS: ${TANK_KEY_ZENAS:-}
      TANK_KEY_BASE: ${TANK_KEY_BASE:-}
      TANK_KEY_RIG: ${TANK_KEY_RIG:-}
      TANK_REGION: ${TANK_REGION:-us-east}
      BASE_AGENT_URL: http://agent-base:8000
      SEARXNG_URL: http://searxng:8080
      TIGER_URL: http://tiger:3000
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - default
      - tervory-gw-template
      - tervory-gw-tiger
      - tervory-gw-market_lab
      - tervory-gw-radix
      - tervory-gw-tisan
      - tervory-gw-zenas
      - tervory-gw-base
      - tervory-gw-rig
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One shot. Creates agent_<name> roles, then exits. Tank does not wait on it
  # and does not mount this code. restart on-failure retries a failed run only.
  agent-roles:
    build:
      context: ./agents
      dockerfile: Dockerfile.roles
    restart: "on-failure"
    # One-shot job: it exits after setting up agent logins, so Coolify must not count it in the stack's health.
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tervory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tervory}
      AGENT_DB_PASSWORD_TEMPLATE: ${AGENT_DB_PASSWORD_TEMPLATE:-}
      AGENT_DB_PASSWORD_TIGER: ${AGENT_DB_PASSWORD_TIGER:-}
      AGENT_DB_PASSWORD_MARKET_LAB: ${AGENT_DB_PASSWORD_MARKET_LAB:-}
      AGENT_DB_PASSWORD_RADIX: ${AGENT_DB_PASSWORD_RADIX:-}
      AGENT_DB_PASSWORD_TISAN: ${AGENT_DB_PASSWORD_TISAN:-}
      AGENT_DB_PASSWORD_ZENAS: ${AGENT_DB_PASSWORD_ZENAS:-}
      AGENT_DB_PASSWORD_BASE: ${AGENT_DB_PASSWORD_BASE:-}
      AGENT_DB_PASSWORD_RIG: ${AGENT_DB_PASSWORD_RIG:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  workspace:
    build:
      context: ./workspace
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      TANK_URL: http://tank:8000
      TANK_API_KEY: ${TANK_API_KEY}
      # Founder-only: set a za tenant's home on the ZA Tank (tenant id + region code only).
      TANK_URL_ZA: ${TANK_URL_ZA:-}
      TANK_API_KEY_ZA: ${TANK_API_KEY_ZA:-}
      TERVORY_ADMIN_USER_IDS: ${TERVORY_ADMIN_USER_IDS:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - tank
    # Coolify attaches the public domain to this service (port 3000).
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  tiger_data:

# Created once on the server before this stack is deployed:
#   docker network create tervory-gw-template
# A later agent gets tervory-gw-<agent>, joined here by tank and postgres only.
networks:
  tervory-gw-template:
    external: true
    name: tervory-gw-template
  # Created once on the server: docker network create tervory-gw-tiger
  tervory-gw-tiger:
    external: true
    name: tervory-gw-tiger
  # Created once on the server: docker network create tervory-gw-market_lab
  tervory-gw-market_lab:
    external: true
    name: tervory-gw-market_lab
  # Internal network, no internet. Created once on the server:
  #   docker network create --internal tervory-gw-radix
  # Radix reaches Tank, Postgres, and Hermes, and nothing else.
  tervory-gw-radix:
    external: true
    name: tervory-gw-radix
  # Created once on the server: docker network create tervory-gw-tisan
  tervory-gw-tisan:
    external: true
    name: tervory-gw-tisan
  # Created once on the server: docker network create tervory-gw-zenas
  tervory-gw-zenas:
    external: true
    name: tervory-gw-zenas
  # Compose creates this corridor on deploy. Base's own compose attaches as external.
  # Not internal: Base reads websites through Tiger's browser and SearXNG.
  tervory-gw-base:
    name: tervory-gw-base
  # Created by this stack on deploy (ROOMS.md). The Rig resource joins it as external.
  tervory-gw-rig:
    name: tervory-gw-rig
