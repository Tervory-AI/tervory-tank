use_default_settings: true

general:
  instance_name: "Tervory Search"
  debug: false

server:
  secret_key: "set-by-env-SEARXNG_SECRET"   # overridden by the SEARXNG_SECRET environment variable
  limiter: false                             # internal callers only; the stack network is the boundary
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false
  - name: startpage
    disabled: true
