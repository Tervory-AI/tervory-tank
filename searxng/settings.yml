use_default_settings: true

general:
  instance_name: "Tervory Search"
  debug: false

server:
  secret_key: "set-by-env-SEARXNG_SECRET"   # overridden by the SEARXNG_SECRET environment variable
  limiter: false                             # internal callers only; the stack network is the boundary
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  # Engine requests leave through Ferry. Ferry leaves through Tor.
  # socks5h so Ferry resolves the names. Timeouts sit above the old 6s / 12s.
  request_timeout: 15.0
  max_request_timeout: 30.0
  extra_proxy_timeout: 10
  pool_connections: 100
  pool_maxsize: 20
  using_tor_proxy: true
  proxies:
    all://:
      - socks5h://Ferry:9050

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false
  - name: startpage
    disabled: true
