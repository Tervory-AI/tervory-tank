# coolify: raw compose
# Coolify resource: trigger-signin, on the existing Boston server only.
# Base directory: ops/trigger-signin. One global issuer at auth.tervory.com.
# Dedicated database/bootstrap volumes; never attach either Tank database.
# Secrets are generated by Coolify; nobody types them. Settings: TRIGGER_SIGNIN_MASTERKEY (immutable,
# exactly 32 ASCII characters), TRIGGER_SIGNIN_SESSION_COOKIE_SECRET (>=32 characters),
# TRIGGER_SIGNIN_POSTGRES_ADMIN_PASSWORD, TRIGGER_SIGNIN_DB_PASSWORD, TRIGGER_SIGNIN_ADMIN_EMAIL,
# TRIGGER_SIGNIN_ADMIN_TEMP_PASSWORD (Coolify-generated, never used by anyone: setup emails the
# founder a link to set their own password), TRIGGER_SIGNIN_BOOTSTRAP_KEY_EXPIRATION,
# TRIGGER_SIGNIN_LOGIN_CLIENT_PAT_EXPIRATION, TRIGGER_SIGNIN_PROXY_NETWORK (existing proxy network name).
# Email: setup turns on SMTP from TRIGGER_SIGNIN_SMTP_* (password referenced from the existing
# Coolify mail secret by name) and sends the founder's setup email once.
# Unmodified upstream v4.20.0, release 22 Oct 2026; API and Login index digests verified.
x-database: &database
  ZITADEL_DATABASE_POSTGRES_HOST: identity-postgres
  ZITADEL_DATABASE_POSTGRES_PORT: "5432"
  ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${TRIGGER_SIGNIN_DB_PASSWORD:?Coolify-generated TRIGGER_SIGNIN_DB_PASSWORD}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
x-runtime: &runtime
  <<: *database
  ZITADEL_MASTERKEY: ${TRIGGER_SIGNIN_MASTERKEY:?Coolify-generated TRIGGER_SIGNIN_MASTERKEY}
  ZITADEL_EXTERNALDOMAIN: auth.tervory.com
  ZITADEL_EXTERNALPORT: "443"
  ZITADEL_EXTERNALSECURE: "true"
  ZITADEL_TLS_ENABLED: "false"
  ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
  ZITADEL_LOG_LEVEL: warn
  ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "true"
  ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWEXTERNALIDP: "false"
  ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_PASSWORDLESSTYPE: "1"
  ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXPASSWORDATTEMPTS: "5"
  ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXOTPATTEMPTS: "5"
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://auth.tervory.com/ui/v2/login/
  ZITADEL_OIDC_DEFAULTLOGINURLV2: https://auth.tervory.com/ui/v2/login/login?authRequest=
  ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://auth.tervory.com/ui/v2/login/logout?post_logout_redirect=
  ZITADEL_SAML_DEFAULTLOGINURLV2: https://auth.tervory.com/ui/v2/login/login?samlRequest=
# Coolify injects app-wide settings via env_file. Override the privileged setup
# capability outside its intended service; empty/null can inherit the real key.
services:
  identity-postgres:
    image: postgres:16.15@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    restart: unless-stopped
    environment:
      TRIGGER_SIGNIN_SETUP_TOKEN: "disabled"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TRIGGER_SIGNIN_POSTGRES_ADMIN_PASSWORD:?Coolify-generated TRIGGER_SIGNIN_POSTGRES_ADMIN_PASSWORD}
    volumes: [identity_database:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 5s
      retries: 20
  trigger-signin-init:
    image: ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    restart: "no"
    command: [init]
    environment:
      TRIGGER_SIGNIN_SETUP_TOKEN: "disabled"
      <<: *database
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${TRIGGER_SIGNIN_POSTGRES_ADMIN_PASSWORD:?Coolify-generated TRIGGER_SIGNIN_POSTGRES_ADMIN_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    networks: [database]
    depends_on:
      identity-postgres:
        condition: service_healthy
  trigger-signin-setup:
    image: ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    restart: "no"
    user: "0"
    command: [setup, --masterkeyFromEnv]
    environment:
      TRIGGER_SIGNIN_SETUP_TOKEN: "disabled"
      <<: *runtime
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Tervory
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${TRIGGER_SIGNIN_ADMIN_EMAIL:?Coolify-generated TRIGGER_SIGNIN_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${TRIGGER_SIGNIN_ADMIN_EMAIL:?Coolify-generated TRIGGER_SIGNIN_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${TRIGGER_SIGNIN_ADMIN_TEMP_PASSWORD:?Coolify-generated TRIGGER_SIGNIN_ADMIN_TEMP_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /bootstrap/machine-key.json
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: tervory-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Tervory bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_EXPIRATIONDATE: ${TRIGGER_SIGNIN_BOOTSTRAP_KEY_EXPIRATION:?Coolify setting bootstrap key expiry}
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /login/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Instance Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${TRIGGER_SIGNIN_LOGIN_CLIENT_PAT_EXPIRATION:?Coolify setting login client expiry}
    volumes: [identity_bootstrap:/bootstrap, identity_login_token:/login]
    networks: [database]
    depends_on:
      trigger-signin-init:
        condition: service_completed_successfully
  trigger-signin-api:
    image: ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    command: [start, --masterkeyFromEnv]
    restart: unless-stopped
    environment:
      <<: *runtime
      TRIGGER_SIGNIN_SETUP_TOKEN: "disabled"
    expose: ["8080"]
    networks: [database, proxy]
    depends_on:
      trigger-signin-setup:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/zitadel, ready]
      interval: 10s
      timeout: 5s
      retries: 30
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRIGGER_SIGNIN_PROXY_NETWORK:?existing Coolify proxy network name}
      traefik.http.routers.trigger-signin-api.rule: Host(`auth.tervory.com`)
      traefik.http.routers.trigger-signin-api.entrypoints: https
      traefik.http.routers.trigger-signin-api.tls: "true"
      traefik.http.routers.trigger-signin-api.tls.certresolver: letsencrypt
      traefik.http.routers.trigger-signin-api.priority: "100"
      traefik.http.routers.trigger-signin-api.service: trigger-signin-api
      traefik.http.services.trigger-signin-api.loadbalancer.server.port: "8080"
      traefik.http.services.trigger-signin-api.loadbalancer.server.scheme: h2c
  trigger-signin-login:
    image: ghcr.io/zitadel/zitadel-login:v4.20.0@sha256:f1abfdf3c5d16eda03cad3b584226207ecc640ca5c679d7c45abbbce7d1d63f0
    restart: unless-stopped
    user: "0"
    environment:
      TRIGGER_SIGNIN_SETUP_TOKEN: "disabled"
      ZITADEL_API_URL: http://trigger-signin-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /login/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${TRIGGER_SIGNIN_SESSION_COOKIE_SECRET:?Coolify-generated TRIGGER_SIGNIN_SESSION_COOKIE_SECRET}
      CUSTOM_REQUEST_HEADERS: Host:auth.tervory.com,X-Forwarded-Proto:https
    volumes: [identity_login_token:/login:ro]
    expose: ["3000"]
    networks: [database, proxy]
    depends_on:
      trigger-signin-api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRIGGER_SIGNIN_PROXY_NETWORK:?existing Coolify proxy network name}
      traefik.http.routers.trigger-signin-login.rule: Host(`auth.tervory.com`) && PathPrefix(`/ui/v2/login`)
      traefik.http.routers.trigger-signin-login.entrypoints: https
      traefik.http.routers.trigger-signin-login.tls: "true"
      traefik.http.routers.trigger-signin-login.tls.certresolver: letsencrypt
      traefik.http.routers.trigger-signin-login.priority: "200"
      traefik.http.routers.trigger-signin-login.service: trigger-signin-login
      traefik.http.services.trigger-signin-login.loadbalancer.server.port: "3000"
      traefik.http.middlewares.trigger-signin-root.replacepath.path: /ui/v2/login/
      traefik.http.routers.trigger-signin-root.rule: Host(`auth.tervory.com`) && Path(`/`)
      traefik.http.routers.trigger-signin-root.entrypoints: https
      traefik.http.routers.trigger-signin-root.tls: "true"
      traefik.http.routers.trigger-signin-root.tls.certresolver: letsencrypt
      traefik.http.routers.trigger-signin-root.priority: "300"
      traefik.http.routers.trigger-signin-root.service: trigger-signin-login
      traefik.http.routers.trigger-signin-root.middlewares: trigger-signin-root
    healthcheck:
      test: [CMD, node, /app/healthcheck.mjs, http://localhost:3000/ui/v2/login/healthy]
      interval: 10s
      timeout: 5s
      retries: 30
  tervory-setup:
    environment:
      TRIGGER_SIGNIN_ISSUER: https://auth.tervory.com
      TRIGGER_SIGNIN_BOOTSTRAP_KEY_EXPIRATION: ${TRIGGER_SIGNIN_BOOTSTRAP_KEY_EXPIRATION:?Coolify setting bootstrap key expiry}
      TRIGGER_SIGNIN_SETUP_TOKEN: ${TRIGGER_SIGNIN_SETUP_TOKEN:?Coolify-generated Boston setup token}
      TRIGGER_SIGNIN_CONFIG_TOKEN: ${TRIGGER_SIGNIN_CONFIG_TOKEN:?Coolify-generated read-only directory capability}
      TRIGGER_SIGNIN_MACHINE_TOKEN: ${TRIGGER_SIGNIN_MACHINE_TOKEN:-}
      TRIGGER_SIGNIN_ADMIN_EMAIL: ${TRIGGER_SIGNIN_ADMIN_EMAIL:?Coolify setting TRIGGER_SIGNIN_ADMIN_EMAIL}
      # Founder-set name shown on sign-in; unset shows a neutral "Welcome!" with no name.
      TRIGGER_SIGNIN_ADMIN_DISPLAY_NAME: ${TRIGGER_SIGNIN_ADMIN_DISPLAY_NAME:-}
      TRIGGER_SIGNIN_SMTP_HOST: ${TRIGGER_SIGNIN_SMTP_HOST:-smtp.gmail.com}
      TRIGGER_SIGNIN_SMTP_PORT: ${TRIGGER_SIGNIN_SMTP_PORT:-587}
      TRIGGER_SIGNIN_SMTP_USER: ${TRIGGER_SIGNIN_SMTP_USER:-tervory@gmail.com}
      TRIGGER_SIGNIN_SMTP_FROM: ${TRIGGER_SIGNIN_SMTP_FROM:-tervory@gmail.com}
      TRIGGER_SIGNIN_SMTP_FROM_NAME: ${TRIGGER_SIGNIN_SMTP_FROM_NAME:-Tervory}
      TRIGGER_SIGNIN_SMTP_PASSWORD: ${TRIGGER_SIGNIN_SMTP_PASSWORD:?existing Coolify secret for the Tervory mail app password}
    build:
      context: ../..
      dockerfile: ops/trigger-signin/Dockerfile.setup
      target: configure
    restart: "no"
    volumes: [identity_bootstrap:/bootstrap]
    networks: [database, signin, backup_outbound]
    depends_on:
      trigger-signin-api:
        condition: service_healthy
  identity-backup:
    build:
      context: ../..
      dockerfile: ops/trigger-signin/Dockerfile.setup
      target: backup
    restart: unless-stopped
    environment:
      TRIGGER_SIGNIN_SETUP_TOKEN: "disabled"
      TANK_REGION: us-east
      TRIGGER_SIGNIN_DB_PASSWORD: ${TRIGGER_SIGNIN_DB_PASSWORD:?Coolify-generated TRIGGER_SIGNIN_DB_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?existing storage account}
      R2_ACCESS_KEY_ID_ZENAS: ${R2_ACCESS_KEY_ID_ZENAS:?existing encrypted backup credential name}
      R2_SECRET_ACCESS_KEY_ZENAS: ${R2_SECRET_ACCESS_KEY_ZENAS:?existing encrypted backup credential name}
      R2_BUCKET_ZENAS_ZA: ${R2_BUCKET_ZENAS_ZA:-}
      R2_BACKUP_RECIPIENT: ${R2_BACKUP_RECIPIENT:?existing public age recipient}
    networks: [database, backup_outbound]
    depends_on:
      identity-postgres:
        condition: service_healthy
volumes:
  identity_login_token:
    name: trigger-signin-us-login-token
  identity_database:
    name: trigger-signin-us-postgres
  identity_bootstrap:
    name: trigger-signin-us-bootstrap
networks:
  signin:
    external: true
    name: tervory-gw-trigger-signin
  backup_outbound: {}
  database:
    internal: true
  proxy:
    external: true
    name: ${TRIGGER_SIGNIN_PROXY_NETWORK:?existing Coolify proxy network name}
