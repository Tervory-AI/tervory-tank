# coolify: raw compose
# Trigger CRM = BottleCRM (Django-CRM).
# Pin: Django-CRM/Django-CRM tag v1.39.0 @ cd7c12a607df1719518fcdaf289864f6ba7d0bcd
# Build contexts use the commit SHA (not the floating tag) so Coolify rebuilds stay pinned.
# Coolify resource: trigger-crm
#   Git: https://github.com/Tervory-AI/tervory-tank  (branch/PR — see overlay)
#   OR public Git https://github.com/Django-CRM/Django-CRM ref v1.39.0 with this compose pasted
#   base_directory: ops/trigger-crm  (when using tervory-tank overlay)
# DB: shared Boston Postgres — database trigger_crm, role trigger_crm (never tank schema).
#     No compose `db` service. DBHOST/DBPASSWORD Coolify names; founder fills password.
# Redis: in-stack for Celery isolation (same 7.4.12 digest as main stack).
# Host: https://crm.tervory.com (Cloudflare Access founder-only). No seed_data. No ENV_TYPE=prod.

services:
  redis:
    # Same pin as docker-compose.yml / docker-compose.za.yml (main stack).
    # 7.4.12 is the current 7.4 patch. It carries the 7.4.11 fix for CVE-2026-81934
    # and the 7.4.9 fix for CVE-2026-23479.
    # Multi-arch index digest; keep identical to the main stack redis image.
    image: redis:7.4.12@sha256:bd28fff4b665fdf1b73e8b5b73ec05d2f858f4fa3c8ea0d7c9bc09f7f6bf7039
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      # tag v1.39.0 → commit cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      context: https://github.com/Django-CRM/Django-CRM.git#cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-crm.tervory.com,backend,trigger-crm-backend,localhost,127.0.0.1}
      DOMAIN_NAME: ${DOMAIN_NAME:-https://crm.tervory.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.tervory.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://crm.tervory.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://crm.tervory.com}
      SECRET_KEY: ${SECRET_KEY}
      DBNAME: ${DBNAME:-trigger_crm}
      DBUSER: ${DBUSER:-trigger_crm}
      DBPASSWORD: ${DBPASSWORD}
      DBHOST: ${DBHOST}
      DBPORT: ${DBPORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY_SSL_HEADER: ${TRUST_PROXY_SSL_HEADER:-true}
      CORS_ALLOW_ALL: ${CORS_ALLOW_ALL:-False}
    command:
      - bash
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py create_default_admin
        python manage.py collectstatic --noinput
        exec gunicorn --pythonpath /run/tervory tervory_connector_wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4
    configs:
      - source: trigger_crm_binding_middleware
        target: /run/tervory/tervory_crm_middleware.py
        mode: 0444
      - source: trigger_crm_binding_wsgi
        target: /run/tervory/tervory_connector_wsgi.py
        mode: 0444
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      internal: {}
      gw:
        aliases:
          - trigger-crm-backend
    security_opt: ["no-new-privileges:true"]

  celery-worker:
    build:
      # tag v1.39.0 → commit cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      context: https://github.com/Django-CRM/Django-CRM.git#cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-crm.tervory.com,backend,trigger-crm-backend,localhost,127.0.0.1}
      DOMAIN_NAME: ${DOMAIN_NAME:-https://crm.tervory.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.tervory.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://crm.tervory.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://crm.tervory.com}
      SECRET_KEY: ${SECRET_KEY}
      DBNAME: ${DBNAME:-trigger_crm}
      DBUSER: ${DBUSER:-trigger_crm}
      DBPASSWORD: ${DBPASSWORD}
      DBHOST: ${DBHOST}
      DBPORT: ${DBPORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    # Celery starts one process per host CPU (8 on Boston) unless told; two is plenty for one CRM.
    command: ["celery", "-A", "crm", "worker", "--loglevel=info", "--concurrency=2"]
    # Ping only this worker; another healthy worker must not mask its failure.
    healthcheck:
      test: ["CMD-SHELL", 'celery -A crm inspect ping --destination "celery@$$HOSTNAME" --timeout 5 >/dev/null 2>&1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - gw
    security_opt: ["no-new-privileges:true"]

  celery-beat:
    build:
      # tag v1.39.0 → commit cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      context: https://github.com/Django-CRM/Django-CRM.git#cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-crm.tervory.com,backend,trigger-crm-backend,localhost,127.0.0.1}
      DOMAIN_NAME: ${DOMAIN_NAME:-https://crm.tervory.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.tervory.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://crm.tervory.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://crm.tervory.com}
      SECRET_KEY: ${SECRET_KEY}
      DBNAME: ${DBNAME:-trigger_crm}
      DBUSER: ${DBUSER:-trigger_crm}
      DBPASSWORD: ${DBPASSWORD}
      DBHOST: ${DBHOST}
      DBPORT: ${DBPORT:-5432}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    command: ["celery", "-A", "crm", "beat", "--loglevel=info"]
    # Beat has no HTTP/RPC probe. Liveness only; this does not prove job delivery.
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; c=Path('/proc/1/cmdline').read_bytes().split(bytes([0])); raise SystemExit(0 if any(arg.rsplit(b'/', 1)[-1] == b'celery' for arg in c) and b'beat' in c else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - gw
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      # tag v1.39.0 → commit cd7c12a607df1719518fcdaf289864f6ba7d0bcd
      context: https://github.com/Django-CRM/Django-CRM.git#cd7c12a607df1719518fcdaf289864f6ba7d0bcd:frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      PUBLIC_DJANGO_API_URL: ${PUBLIC_DJANGO_API_URL:-http://backend:8000}
      PORT: "3000"
      PROTOCOL_HEADER: x-forwarded-proto
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-6M}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - internal
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    driver: bridge
  gw:
    external: true
    name: tervory-gw-trigger-crm

# Repository-owned nonsecret source; Compose validates each config file exists.
configs:
  trigger_crm_binding_middleware:
    file: ./tervory_crm_middleware.py
  trigger_crm_binding_wsgi:
    file: ./tervory_connector_wsgi.py
