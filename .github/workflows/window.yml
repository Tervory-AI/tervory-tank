name: window
on:
  pull_request:
    paths: ['window/**', 'cli/**', '.github/workflows/window.yml']
  push:
    tags: ['window-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: window-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix window --ignore-scripts --no-audit --no-fund
      - run: npm --prefix window run prepare-source
      - run: npm --prefix window test
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, platform: linux, arch: x64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
          - {runner: macos-15-intel, platform: darwin, arch: x64}
          - {runner: macos-15, platform: darwin, arch: arm64}
          - {runner: windows-latest, platform: win32, arch: x64}
          - {runner: windows-11-arm, platform: win32, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - name: Tag and native host match
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          if (process.platform !== process.env.PLATFORM || process.arch !== process.env.ARCH) throw Error('Wrong native runner');
          const version = JSON.parse(readFileSync('window/package.json')).version;
          if (process.env.EVENT === 'push' && process.env.TAG !== 'window-v' + version) throw Error('Tag/version mismatch');
          JS
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libgtk-3-dev libnss3 libasound2t64 xvfb
      - run: npm ci --prefix window --ignore-scripts --no-audit --no-fund
      - run: npm --prefix window run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tervory-window-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: window/dist/
          if-no-files-found: error
          retention-days: 30
