# Deploy straight after a merge to main (founder, 27 Oct): the pull request already
# passed CI, so the deploy no longer waits for the same checks to run again on main.
# Deploy only the apps whose code changed.
# The main app goes first; rooms deploy only if main finished. No manual clicks after a merge.
# The Coolify token lives only in the repo secret COOLIFY_TOKEN and is never printed.
name: deploy-on-merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: deploy-on-merge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.tervory.com' }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      ZA_OFFLINE: ${{ vars.ZA_OFFLINE || '' }}
      AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
      - name: Find the previous deployed commit
        run: |
          # Compare with the previous run that actually ran (success or failure), not only the last
          # success: one app failing must not make every later merge redeploy every app (28 Oct).
          # Cancelled runs are skipped, so their changes are still included. Apps whose last
          # Coolify deployment failed are retried by deploy_changed.py on their own.
          prev=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-on-merge.yml/runs?branch=main&status=completed&per_page=20" \
            | jq -r '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // empty')
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then echo "BEFORE=$prev" >> "$GITHUB_ENV"; fi
      - name: Deploy changed apps
        run: |
          case "$COOLIFY_URL" in https://*) ;; *) echo "::error::COOLIFY_URL must be https"; exit 1 ;; esac
          test -n "$COOLIFY_TOKEN" || { echo "::error::COOLIFY_TOKEN secret is missing"; exit 1; }
          python3 .github/scripts/deploy_changed.py

  live-check:
    needs: deploy
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/live-check.yml
    with:
      wait_for_health: true
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
