name: seal-hardening
on:
  pull_request:
    paths:
      - 'tiger/**'
      - 'agents/tiger/docker-compose.yml'
      - 'docker-compose.yml'
      - 'tests/seal_hardening/**'
      - '.github/workflows/seal-hardening.yml'
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install existing compose parser
        run: pip install PyYAML==6.0.3
      - name: Build unchanged OCR image
        run: docker build -t codex-seal-ocr-test:local tiger
      - name: Offline compose isolation, PNG parity and peak memory
        run: |
          set -o pipefail
          python tests/seal_hardening/compose_probe.py run 2>&1 | tee seal-compose.txt
      - name: Preserve compose evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seal-compose-${{ github.sha }}
          path: seal-compose.txt
