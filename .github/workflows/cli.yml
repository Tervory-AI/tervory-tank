name: cli
on:
  pull_request:
    paths:
      - 'cli/**'
      - 'tank/personal_tokens.py'
      - 'tank/device_login.py'
      - 'workspace/lib/device-login.ts'
      - 'workspace/app/cli/**'
      - 'workspace/lib/tank.ts'
      - 'workspace/app/v1/command/**'
      - 'workspace/middleware.ts'
      - 'workspace/next.config.ts'
      - 'workspace/public/cli/**'
      - '.github/workflows/cli.yml'
permissions:
  contents: read
concurrency:
  group: cli-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fake-tank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      - run: node --check bin/tervory.mjs && node --check src/client.mjs
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm pack --dry-run
        working-directory: cli
      - name: Never publishable to a registry
        run: |
          node -e '
            const p = require("./cli/package.json");
            if (p.private !== true) { console.error("cli/package.json must keep \"private\": true (self-hosted only, no npm)."); process.exit(1); }
            if (p.publishConfig?.registry !== "https://registry.invalid/") { console.error("cli publishConfig.registry must stay https://registry.invalid/."); process.exit(1); }'
      - name: Workspace serves the release files signed-out
        run: |
          for route in '"/cli/install.sh"' '"/cli/latest.json"' '"/cli/releases(.*)"'; do
            grep -qF "$route" workspace/middleware.ts || { echo "workspace/middleware.ts isPublic is missing $route"; exit 1; }
          done
      - name: Committed self-hosted release matches a clean rebuild
        run: |
          node cli/scripts/build-release.mjs --out "$RUNNER_TEMP/cli-release"
          diff -r "$RUNNER_TEMP/cli-release" workspace/public/cli \
            || { echo "Rebuild with: node cli/scripts/build-release.mjs --out workspace/public/cli (bump cli version for any change)"; exit 1; }
      - name: Published versions are immutable
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only --diff-filter=MDR FETCH_HEAD -- workspace/public/cli/releases)
          if [ -n "$changed" ]; then echo "Published CLI release files changed (bump the version instead):"; echo "$changed"; exit 1; fi
