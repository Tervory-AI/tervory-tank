name: cli
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/**'
      - 'tank/personal_tokens.py'
      - 'tank/device_login.py'
      - 'workspace/lib/device-login.ts'
      - 'workspace/app/cli/**'
      - 'workspace/lib/tank.ts'
      - 'workspace/app/v1/command/**'
      - 'workspace/middleware.ts'
      - 'workspace/next.config.ts'
      - 'workspace/public/cli/**'
      - 'workspace/Dockerfile'
      - 'workspace/.gitignore'
      - 'docker-compose.yml'
      - '.github/workflows/cli-release.yml'
      - '.github/workflows/cli.yml'
      - '.github/scripts/cli_version_guard.sh'
permissions:
  contents: read
concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fake-tank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: CLI changed means a version bump (published versions are immutable)
        # A change to cli/bin, cli/src, cli/install.sh, cli/package-lock.json or cli/scripts
        # needs a version above the base branch's, the same version in package-lock.json and
        # a CHANGELOG entry. A base branch without cli/ has nothing to compare against.
        # Inputs reach the script only as environment variables.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
          sh .github/scripts/cli_version_guard.sh FETCH_HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      - run: node --check bin/tervory.mjs && node --check src/client.mjs
        working-directory: cli
      - name: Prepare the local code-command sandbox
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          # Ubuntu hosted runners restrict unprivileged user namespaces through
          # AppArmor. This disposable job needs them for Bubblewrap's isolation;
          # never fall back to running an approved command outside the sandbox.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --die-with-parent --new-session \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp \
            /bin/sh -c 'echo sandbox-ok'
      - run: npm test
        working-directory: cli
      - run: npm pack --dry-run
        working-directory: cli
      - name: Never publishable to a registry
        run: |
          node -e '
            const p = require("./cli/package.json");
            if (p.private !== true) { console.error("cli/package.json must keep \"private\": true (self-hosted only, no npm)."); process.exit(1); }
            if (p.publishConfig?.registry !== "https://registry.invalid/") { console.error("cli publishConfig.registry must stay https://registry.invalid/."); process.exit(1); }'
      - name: Workspace serves the release files signed-out
        run: |
          for route in '"/cli/install.sh"' '"/cli/latest.json"' '"/cli/releases(.*)"'; do
            grep -qF "$route" workspace/middleware.ts || { echo "workspace/middleware.ts isPublic is missing $route"; exit 1; }
          done
      - name: No CLI release artifacts are committed (build outputs only)
        run: |
          committed=$(git ls-files workspace/public/cli)
          if [ -n "$committed" ]; then echo "CLI release files are build outputs (workspace/Dockerfile cli-release stage); remove:"; echo "$committed"; exit 1; fi
          grep -qxF '/public/cli/' workspace/.gitignore || { echo "workspace/.gitignore must ignore /public/cli/"; exit 1; }
      - name: Release build is reproducible
        run: |
          node cli/scripts/build-release.mjs --out "$RUNNER_TEMP/cli-a"
          node cli/scripts/build-release.mjs --out "$RUNNER_TEMP/cli-b"
          diff -r "$RUNNER_TEMP/cli-a" "$RUNNER_TEMP/cli-b"
          # The release, latest.json and therefore install.sh / tervory update offer cli/package.json's version.
          want=$(node -p 'require("./cli/package.json").version')
          node -e '
            const fs = require("fs"), [dir, want] = process.argv.slice(1);
            const latest = JSON.parse(fs.readFileSync(dir + "/latest.json"));
            const m = JSON.parse(fs.readFileSync(dir + "/" + latest.manifest));
            if (latest.version !== want || m.version !== want || latest.manifest !== "releases/" + want + "/manifest.json")
              throw new Error("release offers " + latest.version + " / manifest " + m.version + ", package.json is " + want);
            console.log("release offers " + want);' "$RUNNER_TEMP/cli-a" "$want"
      - name: The Workspace image builds and serves the same release at /cli/
        # Same command the deploy runs (docker-compose.yml additional_contexts.cli=./cli),
        # stopped at the release stage; the build stage copies it into public/cli so Next serves it.
        # The image's checksums verify its own tarballs, and every tarball has the same entries
        # (names, modes, owners, sizes, mtimes) and the same file bytes as the direct build above.
        # The archive bytes themselves can differ between GNU tar versions (the image's Debian
        # tar 1.34 vs the runner's 1.35 encode ustar headers differently), so they are compared
        # by contents here and the served manifest is checked against the served files.
        run: |
          grep -qE '^\s+cli: \./cli$' docker-compose.yml || { echo "docker-compose.yml workspace build needs additional_contexts.cli: ./cli"; exit 1; }
          grep -qxF 'COPY --from=cli-release /out/cli ./public/cli' workspace/Dockerfile || { echo "workspace/Dockerfile must copy the CLI release into public/cli"; exit 1; }
          docker buildx build --build-context cli=cli -f workspace/Dockerfile --target cli-files \
            --output "type=local,dest=$RUNNER_TEMP/cli-image" workspace
          A="$RUNNER_TEMP/cli-a"; B="$RUNNER_TEMP/cli-image"
          diff -r -x '*.tar.gz' -x manifest.json -x SHA256SUMS "$A" "$B"
          (cd "$B"/releases/*/ && sha256sum --strict -c SHA256SUMS)
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const [a, b] = process.argv.slice(1).map(d => { const v = JSON.parse(fs.readFileSync(path.join(d, "latest.json"))).version;
              return { dir: path.join(d, "releases", v), m: JSON.parse(fs.readFileSync(path.join(d, "releases", v, "manifest.json"))) }; });
            const strip = m => JSON.stringify({ ...m, artifacts: Object.fromEntries(Object.entries(m.artifacts).map(([k, x]) => [k, x.file])) });
            if (strip(a.m) !== strip(b.m)) throw new Error("manifest differs beyond hashes");
            for (const x of Object.values(b.m.artifacts)) { const buf = fs.readFileSync(path.join(b.dir, x.file));
              if (buf.length !== x.size || crypto.createHash("sha256").update(buf).digest("hex") !== x.sha256) throw new Error("image manifest does not match " + x.file); }
          ' "$A" "$B"
          bad=0
          for f in "$A"/releases/*/*.tar.gz; do
            g="$B/${f#"$A"/}"
            rm -rf /tmp/xa /tmp/xb && mkdir -p /tmp/xa /tmp/xb && tar -xzf "$f" -C /tmp/xa && tar -xzf "$g" -C /tmp/xb
            # Same entries (names, modes, owners, sizes, mtimes) and the same bytes in every file.
            if ! diff <(tar -tvzf "$f") <(tar -tvzf "$g") || ! diff -r --no-dereference /tmp/xa /tmp/xb; then
              bad=1; echo "release contents differ: ${f##*/}"
            fi
          done
          echo "runner: $(tar --version | head -1); $(gzip --version | head -1); npm $(npm -v)"
          docker run --rm node:22-slim sh -c 'echo "image: $(tar --version | head -1); $(gzip --version | head -1); npm $(npm -v)"'
          test "$bad" = 0
          test -s "$RUNNER_TEMP/cli-image/install.sh" && test -s "$RUNNER_TEMP/cli-image/latest.json"

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Prepare the existing release tests and macOS sandbox
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          brew list wget >/dev/null 2>&1 || brew install wget
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          test -x /usr/bin/sandbox-exec
          mkdir -p "$RUNNER_TEMP/cli-w3-tests"
          echo "TMPDIR=$RUNNER_TEMP/cli-w3-tests" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      - name: Validate the Seatbelt profile on the macOS runner
        run: |
          node --input-type=module -e 'import {seatbeltProfile} from "./cli/src/seatbelt.mjs"; import {writeFile} from "node:fs/promises"; await writeFile(process.env.RUNNER_TEMP + "/cli-w3.sb", (await seatbeltProfile(process.cwd())).replace("(deny default)", "(deny default (with report))"));'
          if /usr/bin/sandbox-exec -f "$RUNNER_TEMP/cli-w3.sb" /usr/bin/true; then
            exit 0
          fi
          # Probe one class at a time with /usr/bin/true only; these diagnostic
          # variants are never used by the CLI or its command tests.
          node --input-type=module -e 'import fs from "node:fs"; import {spawnSync} from "node:child_process"; const base=fs.readFileSync(process.env.RUNNER_TEMP + "/cli-w3.sb","utf8"); for (const [name,rule] of Object.entries({reads:"(allow file-read* file-map-executable)",sysctl:"(allow sysctl-read)",ioctl:"(allow file-ioctl)",fsctl:"(allow system-fsctl)",shared:"(allow ipc-posix*)",process:"(allow process*)",metadata:"(allow file-read-metadata)",mach:"(allow mach-lookup)",system:"(allow file-read* file-map-executable (subpath \"/System\"))",library:"(allow file-read* file-map-executable (subpath \"/Library\"))",database:"(allow file-read* (subpath \"/private/var/db\"))",existence:"(allow file-test-existence)",execution:"(allow process-exec)",syscall:"(allow system-mac-syscall)",all:"(allow default)"})) { const r=spawnSync("/usr/bin/sandbox-exec",["-p",base+"\n"+rule,"/usr/bin/true"],{encoding:"utf8"}); console.log(JSON.stringify({probe:name,status:r.status,signal:r.signal,stderr:r.stderr})); }'
          # Keep diagnostics to this disposable runner's probe crash fields.
          sleep 5
          sudo /usr/bin/log show --last 2m --info --debug --style compact --predicate 'eventMessage CONTAINS "deny" OR eventMessage CONTAINS "ignition"' || true
          node --input-type=module -e 'import fs from "node:fs"; for (const dir of [process.env.HOME + "/Library/Logs/DiagnosticReports", "/Library/Logs/DiagnosticReports"]) { if (!fs.existsSync(dir)) continue; for (const file of fs.readdirSync(dir).filter(x => /^(true|sandbox-exec).*\.ips$/.test(x))) { const text = fs.readFileSync(dir + "/" + file,"utf8"); try { const r = JSON.parse(text.slice(text.indexOf("\n") + 1)); console.log(JSON.stringify({file,exception:r.exception,termination:r.termination,asi:r.asi,triggered:r.threads?.filter(t=>t.triggered)})); } catch { console.log("Probe crash report could not be parsed: " + file); } } }'
          exit 1
      - name: CLI tests including outside-write, secret-read and network confinement
        # The same code-mode suite runs in the Ubuntu job. It requires echo's
        # exit 0 and uses a reachable host listener as the network control.
        run: |
          export PATH="$(brew --prefix gnu-tar)/libexec/gnubin:$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix openssl@3)/bin:/usr/bin:/bin:$PATH"
          npm test
        working-directory: cli
