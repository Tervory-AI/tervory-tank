name: Rig admin review

on:
  pull_request:
    paths:
      - "workspace/app/rig/admin/**"
      - "workspace/lib/tank.ts"
      - "tests/rig_feeds_admin*"
      - ".github/workflows/rig-admin-review.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rig-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install Workspace dependencies
        working-directory: workspace
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
      - name: Check real Tank helper and retailer route
        run: node tests/rig_feeds_admin_route.test.cjs
      - name: Install pinned review browser
        run: |
          npm install --prefix "$RUNNER_TEMP/rig-browser" --no-audit --no-fund esbuild@0.28.2 playwright@1.64.1
          "$RUNNER_TEMP/rig-browser/node_modules/.bin/playwright" install chromium
      - name: Check retailer admin and capture both widths
        run: node tests/rig_feeds_admin_browser.mjs
        env:
          RIG_ESBUILD_PATH: ${{ runner.temp }}/rig-browser/node_modules/esbuild
          RIG_PLAYWRIGHT_PATH: ${{ runner.temp }}/rig-browser/node_modules/playwright
          RIG_SCREENSHOT_DIR: ${{ runner.temp }}/rig-admin-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rig-admin-screenshots
          path: ${{ runner.temp }}/rig-admin-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
