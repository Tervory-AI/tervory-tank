name: radix-page
on:
  pull_request:
    paths:
      - "workspace/app/radix/**"
      - "workspace/app/product-nav.ts"
      - ".github/workflows/radix-page.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace packages
        working-directory: workspace
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
      - name: Install disposable browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/radix-browser" --no-save --no-audit --no-fund esbuild@0.25.0 playwright@1.51.1
          node "$RUNNER_TEMP/radix-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check Radix in Chromium
        working-directory: workspace
        run: node app/radix/tests/browser.mjs
      - name: Save page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radix-page-screenshots
          path: ${{ runner.temp }}/radix-page-site/*.png
