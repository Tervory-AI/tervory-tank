name: window-index
on:
  push:
    branches: [codex/window-index]
  pull_request:
    paths: ['window/extensions/tervory-index/**', '.github/workflows/window-index.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: window-index-${{ github.ref }}
  cancel-in-progress: true
jobs:
  index:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: window/extensions/tervory-index
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: window/extensions/tervory-index/package-lock.json
      - name: Keep temporary files inside this checkout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run model
      - run: npm test
      - name: Stock VSCodium integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - name: Stock VSCodium integration (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:electron
      - name: 10,000-file real-model relevance and timing gate
        run: npm run benchmark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: window-index-${{ matrix.os }}
          path: window/extensions/tervory-index/benchmark-results.json
          if-no-files-found: warn
