name: Trigger CRM isolated image proof
on:
  pull_request:
    paths:
      - 'ops/trigger-crm/**'
      - '.github/workflows/trigger-crm-image.yml'
permissions:
  contents: read
concurrency:
  group: trigger-crm-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  bake-connector:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose and the pinned build graph without environment values
        working-directory: ops/trigger-crm
        run: |
          docker compose config --no-interpolate --format json > "$RUNNER_TEMP/trigger-crm-compose.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads((Path(os.environ['RUNNER_TEMP']) / 'trigger-crm-compose.json').read_text())
          services = config['services']
          backend = services['backend']
          assert not config.get('configs') and not backend.get('configs')
          assert not backend.get('volumes')
          assert backend['build']['dockerfile'] == 'Dockerfile.backend'
          assert backend['build']['additional_contexts'] == {'crm-pinned': 'service:celery-worker'}
          pin = 'https://github.com/Django-CRM/Django-CRM.git#cd7c12a607df1719518fcdaf289864f6ba7d0bcd'
          assert services['celery-worker']['build']['context'] == pin
          assert services['celery-beat']['build']['context'] == pin
          assert services['frontend']['build']['context'] == pin + ':frontend'
          assert 'trigger-crm-backend' in backend['networks']['gw']['aliases']
          assert 'gunicorn --pythonpath /run/tervory tervory_connector_wsgi:application' in ' '.join(backend['command'])
          PY
      - name: Build only isolated images; never start the application or migrations
        working-directory: ops/trigger-crm
        run: |
          cat > "$RUNNER_TEMP/trigger-crm-image-placeholder.yml" <<'YAML'
          services:
            backend:
              image: trigger-crm-placeholder-backend:proof
            celery-worker:
              image: trigger-crm-placeholder-pinned:proof
          YAML
          docker compose -p trigger-crm-placeholder -f docker-compose.yml -f "$RUNNER_TEMP/trigger-crm-image-placeholder.yml" build backend
          docker image inspect trigger-crm-placeholder-pinned:proof trigger-crm-placeholder-backend:proof > "$RUNNER_TEMP/trigger-crm-images.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base, backend = json.loads((Path(os.environ['RUNNER_TEMP']) / 'trigger-crm-images.json').read_text())
          for field in ('Entrypoint', 'Cmd', 'User', 'WorkingDir', 'Env'):
              assert base['Config'][field] == backend['Config'][field], field
          assert not backend['Config'].get('Volumes')
          PY
          docker run --rm -i --network none --read-only --entrypoint python trigger-crm-placeholder-backend:proof - <<'PYTHON'
          import ast
          from pathlib import Path
          files = list(Path("/run/tervory").iterdir())
          assert sorted(p.name for p in files) == ["tervory_connector_wsgi.py", "tervory_crm_middleware.py"]
          for path in files:
              ast.parse(path.read_text())
              assert path.stat().st_mode & 0o777 == 0o444, path
          PYTHON
