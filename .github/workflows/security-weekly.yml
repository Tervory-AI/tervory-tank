name: security-weekly

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC, default branch

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.14"
      - name: Install pinned security CLIs
        id: tools
        run: bash .github/scripts/install-security-tools.sh
      - name: Gitleaks — whole history
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 .github/scripts/security_scan.py gitleaks --output "$RUNNER_TEMP/security-results"
      - name: Semgrep — whole repository
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 .github/scripts/security_scan.py semgrep --output "$RUNNER_TEMP/security-results"
      - name: OSV-Scanner — all lockfiles
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 .github/scripts/security_scan.py osv --output "$RUNNER_TEMP/security-results"
      - name: Save security results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-results/*.json
          if-no-files-found: warn
          retention-days: 14

