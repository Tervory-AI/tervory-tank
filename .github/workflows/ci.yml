name: ci

# Security runs on every PR, including docs-only changes. Build jobs still use ci_scope.py.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs (CI-2). A newer push to the same pull request cancels the
# older run. Runs on main are never cancelled: each main run gets its own group
# (run_id), so it never waits behind or gets replaced by another main run. Since
# 27 Oct the deploy no longer waits for them (deploy-on-merge runs on the push). (With a shared group, GitHub cancels a *pending*
# run when a newer one queues, even with cancel-in-progress false.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Default ref: the PR merged with its base. Checking out the PR head alone broke every PR
          # branched before #374 (the security scripts were not on that branch: exit 127).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.14"
      - name: Install pinned security CLIs
        id: tools
        run: bash .github/scripts/install-security-tools.sh
      - name: Test security gate policy
        run: python3 -m unittest discover -s tests/ci_security -p test_security.py -v
      - name: Gitleaks — PR commits or main push
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          SECURITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/security_scan.py gitleaks --base "$SECURITY_BASE" --output "$RUNNER_TEMP/security-results"
      - name: Semgrep — new high findings
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          SECURITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/security_scan.py semgrep --base "$SECURITY_BASE" --output "$RUNNER_TEMP/security-results"
      - name: OSV-Scanner — new vulnerable versions
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          SECURITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/security_scan.py osv --base "$SECURITY_BASE" --output "$RUNNER_TEMP/security-results"
      - name: Save security results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-results/*.json
          if-no-files-found: warn
          retention-days: 14

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      tisan: ${{ steps.scope.outputs.tisan }}
      tests: ${{ steps.scope.outputs.tests }}
      savings: ${{ steps.scope.outputs.savings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select checks from changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_scope.py

  # Picks where the real jobs run. It only runs when the founder has switched the
  # self-hosted runner on (repository variable SELF_HOSTED_RUNNER_ONLINE=true) and
  # the change is not from a fork. Otherwise it is skipped and the jobs below fall
  # back to ubuntu-latest. See docs/ops/self-hosted-runner.md.
  runner:
    name: pick runner
    if: >-
      vars.SELF_HOSTED_RUNNER_ONLINE == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick runner
        id: pick
        env:
          SELF_HOSTED_ONLINE: ${{ vars.SELF_HOSTED_RUNNER_ONLINE }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          # Optional. A fine-grained token that can only read this repository's
          # runner list (Administration: read-only). Never a Coolify or Tank key.
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          runner='"ubuntu-latest"'
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "Pull request from a fork: GitHub-hosted runner only."
          elif [ "${SELF_HOSTED_ONLINE:-}" != "true" ]; then
            echo "SELF_HOSTED_RUNNER_ONLINE is not true: GitHub-hosted runner."
          elif [ -z "${RUNNER_STATUS_TOKEN:-}" ]; then
            echo "Switch is on and there is no status token: trusting the switch."
            runner='["self-hosted","linux"]'
          else
            online=$(curl -fsS --max-time 10 \
              -H "Authorization: Bearer $RUNNER_STATUS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$THIS_REPO/actions/runners?per_page=100" \
              | jq '[.runners[]
                     | select(.status == "online")
                     | select([.labels[].name | ascii_downcase]
                              | (index("self-hosted") != null and index("linux") != null))]
                    | length') || online=0
            case "$online" in ''|*[!0-9]*) online=0 ;; esac
            if [ "$online" -gt 0 ]; then
              echo "$online self-hosted runner(s) online."
              runner='["self-hosted","linux"]'
            else
              echo "No self-hosted runner online (or the check failed): GitHub-hosted runner."
            fi
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  tank:
    needs: [changes, runner]
    # Run even when "pick runner" was skipped; then the runner falls back to ubuntu-latest.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run == 'true' }}
    # Self-hosted only when "pick runner" chose it and the change is not from a fork.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.runner.outputs.runner && fromJSON(needs.runner.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pooltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tank/requirements.txt
            tank/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r tank/requirements.txt -r tank/requirements-dev.txt
          pip install --require-hashes -r agents/rig/forge/requirements.lock
      - name: Lint
        # F401 in base.socials/1.0.0/run.py is a pre-existing unused import.
        # This lane cannot edit an approved skill in place.
        run: ruff check tank tests --select E9,F --per-file-ignores "tank/skills/base.socials/1.0.0/run.py:F401"
      - name: Secret scan and Tank starts
        # Founder, 27 Oct: the full suite no longer gates merges (it took ~15 minutes).
        # This job checks only lint, the secret scan, and that the real Tank starts on an empty database.
        run: python3 -m pytest -q tests/test_secrets.py tests/test_tank_boots.py tests/test_tank_one_door.py
        env:
          PYTHONPATH: tank
          POOL_SCHEMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pooltest

  workspace:
    needs: [changes, runner]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.runner.outputs.runner && fromJSON(needs.runner.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - name: Install
        working-directory: workspace
        run: npm ci --no-audit --no-fund
      - name: typecheck
        working-directory: workspace
        run: npx tsc --noEmit
      - name: Build
        working-directory: workspace
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Clerk rejects pk_test_ZHVtbXk (it decodes to "dummy", and a publishable
          # key must decode to "<host>$"). This dummy decodes to dummy.clerk.accounts.dev$.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_dummy

  savings-page:
    needs: [changes]
    # Only when the savings pages (or what they render) change. Founder, 27 Oct: no
    # check runs on a pull request it cannot affect.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.savings == 'true' }}
    # Chromium system dependencies need sudo; keep this job on GitHub hosted runners.
    runs-on: ubuntu-latest
    # 8 minutes timed out twice on 22 Oct and cancelled CI on main. Usually ~1 minute.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      # This job installs npm packages and a Playwright Chromium every run, and no pip
      # packages. Cache the npm download cache and the browser. There is no
      # workspace/package-lock.json yet, so the npm key uses package.json.
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: savings-page-npm-${{ runner.os }}-${{ hashFiles('workspace/package.json', 'workspace/package-lock.json') }}-esbuild0.28.2-playwright1.64.1
          restore-keys: |
            savings-page-npm-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: savings-page-playwright-${{ runner.os }}-1.64.1-chromium
      - name: Install workspace and browser test packages
        run: |
          if [ -f workspace/package-lock.json ]; then
            npm --prefix workspace ci --no-audit --no-fund
          else
            npm --prefix workspace install --no-package-lock --no-audit --no-fund
          fi
          npm install --prefix "$RUNNER_TEMP/core2-browser" --no-audit --no-fund esbuild@0.28.2 playwright@1.64.1
          browser=$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)
          if [ -n "$browser" ]; then
            echo "CORE2_CHROMIUM=$browser" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/core2-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Check savings pages at 375px and 1440px
        run: |
          CORE2_ESBUILD_PATH="$RUNNER_TEMP/core2-browser/node_modules/esbuild" \
          CORE2_PLAYWRIGHT_PATH="$RUNNER_TEMP/core2-browser/node_modules/playwright" \
          CORE2_SCREENSHOT_DIR="$RUNNER_TEMP/core2-screenshots" \
          node tests/test_core2_savings_page.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: savings-page-screenshots
          path: ${{ runner.temp }}/core2-screenshots
          if-no-files-found: warn
