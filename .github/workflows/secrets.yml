name: secrets

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, selected by #341
        with:
          fetch-depth: 0
      - name: Validate existing-history baseline
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check_secret_baseline.py "$SCAN_BASE"
      - name: Gitleaks
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scan_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          python3 .github/scripts/check_secret_baseline.py "$SCAN_BASE" \
            --gitleaks "$scan_dir/gitleaks" --head "$SCAN_HEAD"

  install-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, selected by #341
        with:
          fetch-depth: 0
      - name: Reject new unpinned installs
        env:
          PIN_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check_install_pins.py --base "$PIN_BASE"
