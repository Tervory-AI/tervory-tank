name: Tenant RLS and nonroot services
on:
  push:
    branches: [codex/tenant-rls]
    paths:
      - "**/*.py"
      - "**/*.sql"
      - "**/Dockerfile"
      - ".github/workflows/tenant-rls.yml"
  pull_request:
    paths:
      - 'db/migrations/tenant_rls/**'
      - 'tank/**'
      - 'agents/**'
      - 'litellm/**'
      - 'searxng/**'
      - 'site/**'
      - 'tests/test_tenant_rls.py'
      - 'tests/tenant_rls/**'
      - '.github/workflows/tenant-rls.yml'
concurrency:
  group: tenant-rls-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RLS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      POOL_SCHEMA_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      RIG_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      RADIX_PASSIVE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/radix_passive_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install -r tank/requirements.txt -r tank/requirements-dev.txt -r agents/trigger/requirements.txt
      - run: npm ci --prefix workspace --ignore-scripts
      - name: Prepare isolated Radix fixture database
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def prepare():
              conn = await asyncpg.connect(os.environ["POOL_SCHEMA_DATABASE_URL"])
              try:
                  await conn.execute("CREATE DATABASE radix_passive_test")
              finally:
                  await conn.close()
          asyncio.run(prepare())
          PY
      - name: Disposable database isolation and affected regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -s tests/test_tenant_rls.py tests/test_agent_chassis.py tests/test_tank_tenant_boundaries.py tests/test_tank_batches.py tests/test_tank_one_door.py tests/test_command.py tests/test_rig_box.py tests/test_rig_admin.py tests/test_rig_isolation.py tests/test_rig_postgres.py tests/test_vault_contract.py tests/test_base_audit.py tests/test_base_product.py tests/test_core2_baselines.py tests/test_core2_savings.py tests/test_core2c_savings.py tests/test_b3_base_room.py tests/trigger_second_build/test_second.py tests/test_tank_priority_offpeak.py tests/test_base_source_reliability.py tests/test_radix_passive.py tests/test_tank_boots.py tests/test_trigger_signin_guard.py tests/test_tank_semantic_cache.py tests/test_platform_registry_integration.py tests/test_command_streaming.py tests/test_command_code.py tests/test_radix_report.py tests/test_tisan_publish.py tests/test_tisan_gold_proxy.py tests/tenant_bus/test_tiger_history.py::test_saved_tiger_check_through_real_tank 2>&1 | tee tenant-rls-tests.log
      - name: Isolated Tiger role and schema ownership regressions
        run: >-
          python -m pytest -q
          tests/test_tiger_competitors.py::test_room_migration_and_nonowner_tank_admin_after_role_ownership
          tests/test_tiger_competitors.py::test_room_schema_concurrently_repeats_without_catalog_writes
          tests/test_tiger_competitors.py::test_room_schema_repairs_only_missing_table_privileges
      - name: Mobile native proof, sessions, shares and tenant isolation
        env:
          MOBILE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: python -m pytest -q tests/test_mobile_channel.py tests/test_mobile_channel_database.py
      - name: Platform deadline and regional workspace regressions
        run: python -m pytest -q tests/test_offpeak_deadline.py tests/test_platform_workspace.py tests/test_platform_morning.py tests/acceptance/test_platform.py
      - name: Read-only lock inventory regressions
        run: python -m pytest -q -s tests/test_supply_chain_watch.py
      - name: Window agent jobs and review regressions
        run: python -m pytest -q tests/test_window_agents.py tests/test_window_agent_reviews.py
      - name: Capture integration registry for reviewed golden updates
        if: always()
        run: |
          python tests/test_registry_frozen.py --snapshot > registry-review.json
          git rev-parse HEAD > registry-review-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: registry-review-${{ github.sha }}
          path: |
            registry-review.json
            registry-review-commit.txt
          if-no-files-found: error
      - name: Real Market Lab fixture with inherited listener sockets
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/market_fixture_test
        run: |
          python - <<'PYDB'
          import asyncio, asyncpg, os
          async def create():
              conn = await asyncpg.connect(os.environ["POOL_SCHEMA_DATABASE_URL"])
              try:
                  await conn.execute("CREATE DATABASE market_fixture_test")
              finally:
                  await conn.close()
          asyncio.run(create())
          PYDB
          python -m pytest -q tests/test_market_lab_real_tank.py
      - name: Paid protocol, private chats, settings browser and receipt regressions
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest -q tests/test_paid_steps.py tests/test_platform_routellm_serving.py tests/test_tank_routing_data.py tests/test_paid_steps_chats.py tests/test_paid_steps_settings.py tests/test_tank_semantic_cache.py tests/test_rig_landing_overflow.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tenant-rls-tests
          path: tenant-rls-tests.log
  nonroot-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - name: Build and start all four services without network or root
        shell: bash
        run: |
          set -o pipefail
          python tests/tenant_rls/container_smoke.py 2>&1 | tee nonroot-services.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nonroot-services
          path: nonroot-services.log
  autumbra-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install pytest==9.1.1 pytest-asyncio==1.4.1
      - name: Enforce probe on disposable internal compose networks only
        env:
          AUTUMBRA_A2_CI_PROBE: '1'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -s tests/autumbra_a2/test_compose_probe.py 2>&1 | tee autumbra-isolation.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: autumbra-isolation
          path: autumbra-isolation.log
