  # ---------- MODELS-3: open-weight models via Hugging Face Inference Providers ----------
  # One least-privilege token, HF_INFERENCE_TOKEN ("Make calls to Inference Providers" only),
  # billed to Tervory's Hugging Face account. Not the training HF_TOKEN. Each entry pins the
  # cheapest host that answered a live call on the build day. Hugging Face host roster prices
  # are estimates, to be reconciled against the first Hugging Face invoice.
  # family = the model maker (never the host); TANK_PROVIDER_ALLOW applies by model name.
  # Route: LiteLLM's OpenAI-compatible client on the Hugging Face router (model id + ':' + host).
  # LiteLLM v1.106.0's huggingface/ prefix prices every call at $0, which would zero the receipt;
  # this route reaches the same router with the same token and records the cost.
  # Bench entries only: no serving chain falls back to them and no policy row names them.
  # Catalogue: https://huggingface.co/api/models?inference_provider=all&pipeline_tag=text-generation&author=<org>&sort=downloads
  # Hosts and prices: https://router.huggingface.co/v1/models/<hf id> (USD per MTok), checked 2026-10-21.

  # meta flagship. Host: Novita via Hugging Face. Licence: Llama 4 Community License, https://huggingface.co/meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8/blob/main/LICENSE
  # Licence conditions: Acceptable use policy https://www.llama.com/llama4/use-policy ; licence from Meta needed above 700M MAU; show "Built with Llama"; a fine-tuned model's name must start with "Llama"; multimodal rights not granted to EU-based companies.
  # Price checked 2026-10-21: https://router.huggingface.co/v1/models/meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8
  # USD per MTok: input $0.27, output $0.85 (novita row).
  - model_name: llama
    litellm_params:
      model: openai/meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8:novita
      api_base: https://router.huggingface.co/v1
      api_key: os.environ/HF_INFERENCE_TOKEN
      input_cost_per_token: 0.0000002700
      output_cost_per_token: 0.0000008500
    model_info:
      input_cost_per_token: 0.0000002700
      output_cost_per_token: 0.0000008500
      open_weights: true
      family: meta
      size: flagship
      host: novita
      hf_model_id: meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8
      licence: Llama 4 Community License
      licence_url: https://huggingface.co/meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8/blob/main/LICENSE

