# Tervory workers. Deploy this file as its own Coolify app (tervory-workers).
# It is not part of the main stack. Boston joins Tank's network below.
# The third server uses the same file: point TANK_DOCKER_NETWORK at a network
# that routes over WireGuard, and set WORKER_LINK=wireguard. No code change.
# Nothing here is published. Tank stays off the public internet.

services:
  workers:
    build:
      context: .
      dockerfile: workers/Dockerfile
    image: tervory-workers:1
    restart: unless-stopped
    mem_limit: ${WORKER_SERVICE_MEMORY:-6g}
    cpus: ${WORKER_SERVICE_CPUS:-3}
    # Hard limits for the whole service. Task containers run with cgroups disabled,
    # so these outer limits are what cap a task's memory, CPU and processes.
    pids_limit: 1024
    devices:
      - /dev/fuse
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SETUID
      - SETGID
    environment:
      WORKER_MAX_TASKS: ${WORKER_MAX_TASKS:-1}
      WORKER_TASK_CPUS: ${WORKER_TASK_CPUS:-2}
      WORKER_TASK_MEMORY: ${WORKER_TASK_MEMORY:-4g}
      WORKER_TASK_TIMEOUT_MINUTES: ${WORKER_TASK_TIMEOUT_MINUTES:-90}
      WORKER_LINK: ${WORKER_LINK:-internal}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-60}
      WORKER_REPO: ${WORKER_REPO:-Tervory-AI/tervory-tank}
      WORKER_TENANT_ID: ${WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      WORKER_TASK_TYPE: ${WORKER_TASK_TYPE:-reason.brief}
      TANK_URL: ${TANK_URL:-http://tank:8000}
      TANK_REGION: ${TANK_REGION:-us-east}
      TANK_KEY_WORKERS: ${TANK_KEY_WORKERS:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      # Multiline PEM from the Coolify setting. Kept in memory (tmpfs) in a 0700 directory
      # only the service reads. Never mounted into a task container. No host file.
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      WORKER_STATE_DIR: /var/lib/workers
    tmpfs:
      - /var/lib/workers
      - /run/user/1000
    networks:
      - tank
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  tank:
    external: true
    name: ${TANK_DOCKER_NETWORK:-tervory-tank}
